<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Services – GugsLocalConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
        <path d="M120 20 C 76 20, 40 56, 40 100 C 40 150, 120 240, 120 240 C 120 240, 200 150, 200 100 C 200 56, 164 20, 120 20 Z" fill="#343B73"/>
        <circle cx="120" cy="100" r="42" fill="#F5EECB"/>
        <circle cx="120" cy="100" r="22" fill="none" stroke="#B4CA9E" stroke-width="6"/>
        <circle cx="120" cy="100" r="8" fill="#B4CA9E"/>
      </svg>
      <span class="logo-text">GugsLocal<span class="logo-accent">Connect</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="search.html" class="active">Browse</a>
      <a href="index.html#how">How it works</a>
    </nav>
    <div class="nav-actions">
      <a href="login.html" class="btn-outline">Log in</a>
      <a href="signup.html" class="btn-primary">Sign up</a>
    </div>
  </header>

  <section class="search-topbar">
    <form class="search-box compact" id="searchForm">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="#343B73" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search services">
      <button type="submit">Search</button>
    </form>
  </section>

  <section class="search-layout">
    <aside class="filter-sidebar">
      <h3>Filters</h3>

      <div class="filter-group" id="categoryFilters">
        <h4>Category</h4>
        <label><input type="checkbox" class="filter-category" value="Plumbing"> Plumbing</label>
        <label><input type="checkbox" class="filter-category" value="Hairdressing"> Hairdressing</label>
        <label><input type="checkbox" class="filter-category" value="Catering"> Catering</label>
        <label><input type="checkbox" class="filter-category" value="Tutoring"> Tutoring</label>
        <label><input type="checkbox" class="filter-category" value="Carpentry"> Carpentry</label>
        <label><input type="checkbox" class="filter-category" value="Cleaning"> Cleaning</label>
      </div>

      <div class="filter-group">
        <h4>Location</h4>
        <select id="locationFilter">
          <option value="">All areas</option>
          <option value="NY 108">NY 108</option>
          <option value="Section 3">Section 3</option>
          <option value="Gugulethu Central">Gugulethu Central</option>
        </select>
      </div>

      <div class="filter-group">
        <h4>Rating</h4>
        <label><input type="radio" name="rating" class="filter-rating" value="4.5"> 4.5 and above</label>
        <label><input type="radio" name="rating" class="filter-rating" value="4.0"> 4.0 and above</label>
        <label><input type="radio" name="rating" class="filter-rating" value="0" checked> Any</label>
      </div>
    </aside>

    <div class="results">
      <div class="results-head">
        <p><strong id="resultsCount">6</strong> results found</p>
        <select class="sort" id="sortSelect">
          <option value="recommended">Sort: Recommended</option>
          <option value="rating">Highest rated</option>
        </select>
      </div>

      <div class="browse-grid" id="browseGrid"></div>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">
        <svg class="logo-mark small" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
          <path d="M120 20 C 76 20, 40 56, 40 100 C 40 150, 120 240, 120 240 C 120 240, 200 150, 200 100 C 200 56, 164 20, 120 20 Z" fill="#F5EECB"/>
          <circle cx="120" cy="100" r="42" fill="#343B73"/>
          <circle cx="120" cy="100" r="22" fill="none" stroke="#B4CA9E" stroke-width="6"/>
          <circle cx="120" cy="100" r="8" fill="#B4CA9E"/>
        </svg>
        <div><h3>GugsLocalConnect</h3><p>Find local. Support local.</p></div>
      </div>
      <p class="footer-copy">© 2026 GugsLocalConnect. Built for Gugulethu.</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="search.js"></script>
</body>
</html>
