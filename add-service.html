<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Service – GugsLocalConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
        <path d="M120 20 C 76 20, 40 56, 40 100 C 40 150, 120 240, 120 240 C 120 240, 200 150, 200 100 C 200 56, 164 20, 120 20 Z" fill="#343B73"/>
        <circle cx="120" cy="100" r="42" fill="#F5EECB"/>
        <circle cx="120" cy="100" r="22" fill="none" stroke="#B4CA9E" stroke-width="6"/>
        <circle cx="120" cy="100" r="8" fill="#B4CA9E"/>
      </svg>
      <span class="logo-text">GugsLocal<span class="logo-accent">Connect</span></span>
    </a>
    <nav class="nav-links">
      <a href="dashboard-business.html">Dashboard</a>
      <a href="my-services.html" class="active">My Services</a>
      <a href="messages.html">Messages</a>
    </nav>
    <div class="nav-actions">
      <a href="index.html" class="btn-outline">Log out</a>
    </div>
  </header>

  <section class="form-page">
    <div class="form-page-inner">
      <a href="my-services.html" class="back-link">← Back to services</a>
      <h1>Add new service</h1>
      <p class="form-sub">Describe the service customers can book.</p>

      <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='my-services.html';">

        <label for="title">Service title</label>
        <input type="text" id="title" placeholder="e.g. Leak Detection" required>

        <label for="category">Category</label>
        <select id="category" required>
          <option>Plumbing</option>
          <option>Hairdressing</option>
          <option>Catering</option>
          <option>Tutoring</option>
          <option>Carpentry</option>
          <option>Cleaning</option>
        </select>

        <label for="description">Description</label>
        <textarea id="description" rows="4" placeholder="Briefly describe this service" required></textarea>

        <label for="price">Price range (optional)</label>
        <input type="text" id="price" placeholder="e.g. R250 – R500">

        <label for="area">Service area</label>
        <input type="text" id="area" placeholder="e.g. Gugulethu" required>

        <button type="submit" class="btn-primary btn-full">Publish service</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">
        <svg class="logo-mark small" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
          <path d="M120 20 C 76 20, 40 56, 40 100 C 40 150, 120 240, 120 240 C 120 240, 200 150, 200 100 C 200 56, 164 20, 120 20 Z" fill="#F5EECB"/>
          <circle cx="120" cy="100" r="42" fill="#343B73"/>
          <circle cx="120" cy="100" r="22" fill="none" stroke="#B4CA9E" stroke-width="6"/>
          <circle cx="120" cy="100" r="8" fill="#B4CA9E"/>
        </svg>
        <div><h3>GugsLocalConnect</h3><p>Find local. Support local.</p></div>
      </div>
      <p class="footer-copy">© 2026 GugsLocalConnect. Built for Gugulethu.</p>
    </div>
  </footer>

</body>
</html>
